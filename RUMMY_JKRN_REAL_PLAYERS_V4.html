<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RUMMY JKRN V10 - POOL RUMMY - 201 POOL STRICT RULES</title>
<style>
* { box-sizing: border-box; }
body { 
    margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: #111; color: white; text-align: center; overflow-x: hidden; 
}

.top-bar {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: #000; border-bottom: 2px solid #333;
}
h1 { margin: 0; color: #ffd700; font-size: 18px; }
.top-right-box { display: flex; align-items: center; gap: 8px; }
#walletBox { font-size: 14px; font-weight: bold; color: #ffeb3b; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 15px; border: 1px solid #b8860b; }

.scoreboard-icon-btn, .sound-toggle-btn {
    background: linear-gradient(to bottom, #ffd700, #ff8f00);
    color: #000; border: 2px solid #fff; padding: 6px 12px; border-radius: 20px;
    font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5); transition: transform 0.2s;
}
.sound-toggle-btn { background: linear-gradient(to bottom, #4caf50, #2e7d32); color: #fff; }

.table { 
    position: relative;
    width: min(92vw, 1240px);
    max-width: 1240px;
    height: 58vh;
    min-height: 430px;
    margin: 18px auto 190px;
    background: radial-gradient(ellipse at 50% 46%, #168a49 0%, #0b6a36 48%, #04361d 100%);
    border: 10px solid #3b2106;
    border-radius: 50% / 42%;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.06), inset 0 0 60px rgba(0,0,0,.82), 0 0 28px rgba(0,0,0,.75);
    overflow: visible;
}

.opp-box {
    position: absolute; display: flex; align-items: center;
    background: rgba(0,0,0,0.85); border-radius: 30px; padding: 4px 12px 4px 4px;
    border: 2px solid #555; width: 185px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
}
.opp-box.active-turn { border: 3px solid #00ff00 !important; box-shadow: 0 0 20px #00ff00; }
.opp-avatar { width: 38px; height: 38px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #333; border: 2px solid white; }
.opp-details { margin-left: 8px; text-align: left; }
.opp-name { font-size: 11px; color: #fff; margin: 0; }
.opp-score { font-size: 11px; color: #ffd700; font-weight: bold; margin: 0; }

#opp2 { top: 35%; left: 3%; }
#opp3 { top: 15%; left: 22%; }
#opp4 { top: 5%; left: 50%; transform: translateX(-50%); }
#opp5 { top: 15%; right: 22%; }
#opp6 { top: 35%; right: 3%; }

/* --- CLEAN & FIXED CENTER AREA --- */
.center-area {
    position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 30px; align-items: center; justify-content: center;
    z-index: 50;
}
.pile-container { text-align: center; display: flex; flex-direction: column; align-items: center; }
.pile-label { font-size: 12px; color: #ffd700; margin-bottom: 6px; font-weight: bold; text-shadow: 1px 1px 2px #000; }

.pile { 
    width: 85px; height: 120px; border-radius: 8px; display: flex; align-items: center; justify-content: center; 
    font-size: 20px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.6); border: 2px solid #fff; cursor: pointer;
    background: white; color: black; position: relative; padding: 6px;
    transition: transform 0.2s;
}
.pile:hover { transform: scale(1.04); }
.draw-pile { background: #174a9c; color: white; border-color: #aaa; }
.draw-pile::after { content: '🂠'; font-size: 45px; }

.joker-pile {
    border: 2px solid #ffd700 !important;
    box-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    background: #fff; color: #000;
    flex-direction: column; justify-content: space-between; align-items: flex-start;
}

/* Neat Take Buttons Placed Below Piles */
.pile-action-btn {
    margin-top: 8px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: bold;
    border: 1px solid #fff;
    border-radius: 6px;
    background: linear-gradient(to bottom, #ff9800, #e65100);
    color: #fff;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,0.4);
}
.pile-action-btn:hover { background: linear-gradient(to bottom, #f57c00, #ef6c00); }

.player-area {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: -178px;
    width: min(96vw, 1180px); text-align: center; display: flex; flex-direction: column;
    align-items: center; z-index: 950 !important;
}
.groups-container {
    display: flex; justify-content: center; align-items: flex-end; gap: 10px;
    height: 150px; overflow-x: auto; max-width: 96%; padding: 2px 6px 0;
}
.card-group { 
    display: flex; flex-direction: column; background: rgba(0,0,0,0.5); padding: 4px; 
    border-radius: 6px; align-items: center; flex-shrink: 0; border: 2px dashed transparent;
}
.cards-in-group { display: flex; align-items: flex-end; min-height: 112px; }
.card { 
    width: 74px; height: 108px; background: white; color: black; border-radius: 5px; 
    display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; 
    font-size: 17px; font-weight: bold; padding: 5px; box-shadow: -2px 0 5px rgba(0,0,0,0.6); 
    cursor: grab; border: 1px solid #bbb; position: relative; user-select: none;
}
.cards-in-group .card + .card { margin-left: -36px; }
.card.selected { transform: translateY(-16px) !important; border: 2px solid #ff5722 !important; box-shadow: 0 0 10px #ff5722; }
.card.red { color: #d32f2f !important; }
.card.black { color: #111 !important; }

.left-controls { position: absolute; left: 25px; bottom: 25px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
.action-buttons { position: absolute; right: 25px; bottom: 25px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
.left-controls button, .action-buttons button {
    padding: 12px 18px; border: none; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase;
}
.btn-drop { background: #e53935; }
.btn-auto-sort { background: #2e7d32; }
.btn-group { background: #fbc02d; color: #000; }
.btn-discard { background: #2196f3; }
.btn-declare { background: #ff9800; }

.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 1000; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-box { background: #2a1147; border: 2px solid #ffd700; padding: 20px; border-radius: 12px; width: 90%; max-width: 700px; color: #fff; }
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body onload="initAutoGame()">

<div id="onlineLobby" style="position:fixed;inset:0;background:#050f08;z-index:99999;display:flex;align-items:center;justify-content:center;color:#fff;">
  <div style="background:#102216;border:2px solid #ffd700;padding:25px;border-radius:15px;width:350px;text-align:center;">
    <h2>🃏 RUMMY JKRN</h2>
    <input id="onlineName" type="text" placeholder="Enter Name" style="width:100%;padding:10px;margin:10px 0;background:#000;color:#fff;border:1px solid #555;border-radius:5px;" autocomplete="off">
    <button onclick="createOnlineRoom()" style="width:100%;padding:10px;background:#ffd700;color:#000;font-weight:bold;border:none;border-radius:5px;cursor:pointer;margin-top:5px;">CREATE ROOM</button>
    <button onclick="joinOnlineRoom()" style="width:100%;padding:10px;background:#4caf50;color:#fff;font-weight:bold;border:none;border-radius:5px;cursor:pointer;margin-top:10px;">JOIN ROOM</button>
    <input id="onlineRoom" type="text" placeholder="Room ID" style="width:100%;padding:8px;margin-top:10px;background:#000;color:#fff;border:1px solid #555;border-radius:5px;" autocomplete="off">
    <div id="onlineStatus" style="font-size:12px;color:#aaa;margin-top:10px;"></div>
  </div>
</div>

<div class="top-bar">
    <h1>🃏 POOL RUMMY (<span id="poolTypeDisplay">201</span> POOL)</h1>
    <div class="top-right-box">
        <button class="sound-toggle-btn" id="soundToggleBtn" onclick="toggleSound()">🔊 Sound</button>
        <div id="walletBox">🪙 <span id="walletBalance">50000</span></div>
    </div>
</div>

<div class="table">
    <div class="opp-box" id="opp2"><div class="opp-avatar">🤖</div><div class="opp-details"><p class="opp-name">Player 2</p><p class="opp-score">Score: <span id="score-p2">0</span></p></div></div>
    <div class="opp-box" id="opp3"><div class="opp-avatar">🤖</div><div class="opp-details"><p class="opp-name">Player 3</p><p class="opp-score">Score: <span id="score-p3">0</span></p></div></div>
    <div class="opp-box" id="opp4"><div class="opp-avatar">🤖</div><div class="opp-details"><p class="opp-name">Player 4</p><p class="opp-score">Score: <span id="score-p4">0</span></p></div></div>
    <div class="opp-box" id="opp5"><div class="opp-avatar">🤖</div><div class="opp-details"><p class="opp-name">Player 5</p><p class="opp-score">Score: <span id="score-p5">0</span></p></div></div>
    <div class="opp-box" id="opp6"><div class="opp-avatar">🤖</div><div class="opp-details"><p class="opp-name">Player 6</p><p class="opp-score">Score: <span id="score-p6">0</span></p></div></div>

    <!-- Clean Non-Overlapping Center Area -->
    <div class="center-area">
        <div class="pile-container">
            <div class="pile-label">WILD JOKER</div>
            <div class="pile joker-pile" id="topJokerDisplay">-</div>
        </div>

        <div class="pile-container">
            <div class="pile-label">CLOSED DECK</div>
            <div class="pile draw-pile" onclick="drawCard()"></div>
            <button class="pile-action-btn" onclick="drawCard()">TAKE CLOSED</button>
        </div>

        <div class="pile-container">
            <div class="pile-label">OPEN DECK</div>
            <div class="pile discard-pile" id="discardPile" onclick="drawFromDiscard()"></div>
            <button class="pile-action-btn" onclick="drawFromDiscard()">TAKE OPEN</button>
        </div>
    </div>

    <div class="left-controls">
        <button class="btn-drop" onclick="dropGame()">Drop</button>
        <button class="btn-auto-sort" onclick="autoSortCards()">Auto Sort</button>
        <button class="btn-group" id="groupButton" onclick="groupSelectedCards()">Group</button>
    </div>

    <div class="player-area" id="playerArea">
        <div class="groups-container" id="playerGroupsContainer"></div>
    </div>

    <div class="action-buttons">
        <button class="btn-discard" id="discardButton" onclick="discardCard()">Discard</button>
        <button class="btn-declare" id="declareButton" onclick="declareGame()">Declare</button>
    </div>
</div>

<script>
function initAutoGame() {
    document.getElementById("onlineLobby").style.display = "none";
}
function createOnlineRoom() {
    document.getElementById("onlineLobby").style.display = "none";
}
function joinOnlineRoom() {
    document.getElementById("onlineLobby").style.display = "none";
}
function toggleSound() {}
function drawCard() { alert("Drawing from Closed Deck"); }
function drawFromDiscard() { alert("Drawing from Open Deck"); }
function dropGame() { alert("Drop game"); }
function autoSortCards() { alert("Sorting cards"); }
function groupSelectedCards() { alert("Grouping cards"); }
function discardCard() { alert("Discarding card"); }
function declareGame() { alert("Declaring game"); }
</script>
</body>
</html>
