<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RUMMY JKRN - 101 / 201 Pool</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#071b13;color:#fff}
header{padding:16px 22px;background:linear-gradient(135deg,#0d5a38,#8b6508);display:flex;justify-content:space-between;align-items:center}
.logo{font-size:25px;font-weight:900}.sub{opacity:.8;font-size:12px}
.panel{max-width:1200px;margin:22px auto;padding:20px;background:#10291e;border:1px solid #9a7a22;border-radius:18px;box-shadow:0 15px 40px #0008}
.row{display:flex;gap:10px;flex-wrap:wrap}.field{padding:12px;border-radius:10px;border:1px solid #55735f;background:#07160f;color:#fff}
button{padding:11px 16px;border:0;border-radius:10px;font-weight:800;cursor:pointer;background:#d5a928;color:#15100a}
button:disabled{opacity:.4;cursor:not-allowed}.danger{background:#9b3030;color:white}.green{background:#16804e;color:white}
.hidden{display:none}.mode{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:15px}
.mode button{min-height:70px;background:#173d2b;color:white;border:1px solid #9a7a22}
.table{min-height:530px;border-radius:28px;background:radial-gradient(circle,#17663d,#083320 65%);border:8px solid #805d18;position:relative;padding:25px}
.seats{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap}.seat{min-width:130px;text-align:center;background:#092217cc;border:1px solid #6d8f73;border-radius:12px;padding:10px}
.active{box-shadow:0 0 0 3px #ffd45a}.me{color:#ffd45a}.cards{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin:20px auto}
.card{width:55px;height:78px;border-radius:8px;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;border:2px solid #ddd;cursor:pointer}
.red{color:#c51e2d}.selected{transform:translateY(-12px);border-color:#e1b62e;box-shadow:0 6px 15px #0008}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:18px}.status{text-align:center;color:#ffd45a;font-weight:800}
.log{margin-top:15px;padding:10px;background:#06130d;border-radius:10px;min-height:35px}
@media(max-width:700px){.mode{grid-template-columns:1fr}.card{width:43px;height:62px;font-size:17px}.table{padding:12px}}
</style>
</head>
<body>
<header><div><div class="logo">🎴 RUMMY JKRN</div><div class="sub">101 Pool • 201 Pool</div></div><div id="timer">30</div></header>

<div class="panel" id="lobby">
  <h2>Dashboard</h2>
  <div class="row">
    <input id="name" class="field" placeholder="Player name" value="Player 1">
    <select id="pool" class="field"><option value="101">101 Pool</option><option value="201">201 Pool</option></select>
    <button onclick="createRoom()">Create Private Table</button>
  </div>
  <div class="row" style="margin-top:10px">
    <input id="room" class="field" placeholder="Room code">
    <button class="green" onclick="joinRoom()">Join Online Table</button>
  </div>
  <div class="mode">
    <button onclick="alert('Friends mode: invite/share the private room code.')">👥 Friends<br><small>Invite & play</small></button>
    <button onclick="alert('Online matchmaking foundation is ready; matchmaking queue can be added next.')">🌐 Online<br><small>Find players</small></button>
    <button onclick="createRoom()">🔒 Private Table<br><small>Room code</small></button>
  </div>
  <div class="log" id="message">Create a table or join a room.</div>
</div>

<div class="panel hidden" id="game">
  <div class="row" style="justify-content:space-between">
    <div><b id="roomTitle"></b><br><span id="poolTitle"></span></div>
    <div>⭐ Wild Joker: <b id="joker">-</b><br>Deck: <b id="deckCount">0</b></div>
  </div>
  <div class="table">
    <div class="seats" id="seats"></div>
    <div class="status" id="turnStatus">Waiting...</div>
    <div class="cards" id="hand"></div>
    <div class="controls">
      <button id="startBtn" onclick="startGame()">START GAME</button>
      <button id="drawBtn" class="green" onclick="draw()">DRAW</button>
      <button id="discardBtn" onclick="discard()">DISCARD</button>
      <button id="dropBtn" class="danger" onclick="drop()">DROP</button>
      <button id="declareBtn" onclick="declare()">DECLARE</button>
    </div>
    <div style="text-align:center">Open Card: <span id="openCard">-</span></div>
  </div>
  <div class="log" id="gameMsg"></div>
</div>

<script>
const socket=io();
let myHand=[],selected=-1,myTurn=false,roomId="",started=false,timer=30,timerInt;

const $=id=>document.getElementById(id);
function msg(t){$("message").textContent=t}
function gameMsg(t){$("gameMsg").textContent=t}

function createRoom(){
  socket.emit("createRoom",{name:$("name").value.trim()||"Player",pool:Number($("pool").value)});
}
function joinRoom(){
  socket.emit("joinRoom",{roomId:$("room").value.trim(),name:$("name").value.trim()||"Player"});
}
function startGame(){socket.emit("startGame")}
function draw(){socket.emit("draw")}
function discard(){if(selected<0)return gameMsg("Select a card to discard.");socket.emit("discard",{index:selected});selected=-1}
function drop(){socket.emit("drop")}
function declare(){socket.emit("declare")}

socket.on("joined",d=>{
  roomId=d.roomId;$("lobby").classList.add("hidden");$("game").classList.remove("hidden");
  $("roomTitle").textContent="Room: "+roomId;
});
socket.on("errorMessage",m=>{msg(m);gameMsg(m)});
socket.on("roomState",r=>{
  started=r.started;$("roomTitle").textContent="Room: "+r.id;
  $("poolTitle").textContent=r.pool+" Pool Rummy";
  $("joker").textContent=r.wildJoker?r.wildJoker.rank+r.wildJoker.suit:"-";
  $("deckCount").textContent=r.deckCount;
  $("openCard").textContent=r.discardTop?r.discardTop.rank+r.discardTop.suit:"-";
  $("seats").innerHTML=r.players.map((p,i)=>`<div class="seat ${r.turn===i?"active":""} ${p.id===socket.id?"me":""}">
  <b>Seat ${p.seat}</b><br>${esc(p.name)}<br>${p.cardCount} cards<br>Score: ${p.score}${p.dropped?"<br>DROP":""}</div>`).join("");
  const active=r.players[r.turn];
  $("turnStatus").textContent=active?("Turn: "+active.name):"Waiting...";
  $("startBtn").disabled=started || r.players[0]?.id!==socket.id;
  $("drawBtn").disabled=!myTurn || myHand.length>=14;
  $("discardBtn").disabled=!myTurn || myHand.length!==14;
  $("dropBtn").disabled=!myTurn;
  $("declareBtn").disabled=!myTurn || myHand.length!==13;
});
socket.on("myHand",d=>{
  myHand=d.hand||[];myTurn=!!d.myTurn;renderHand();
  if(myTurn){timer=30;startTimer()}else stopTimer();
});
socket.on("result",r=>gameMsg("🏆 "+r.message));
function renderHand(){
  $("hand").innerHTML=myHand.map((c,i)=>{
    const red=c.suit==="♥"||c.suit==="♦";
    return `<div class="card ${red?"red":""} ${i===selected?"selected":""}" onclick="selectCard(${i})">${c.rank}${c.suit}</div>`;
  }).join("");
}
function selectCard(i){selected=selected===i?-1:i;renderHand()}
function startTimer(){
  clearInterval(timerInt);$("timer").textContent=timer;
  timerInt=setInterval(()=>{timer--;$("timer").textContent=timer;if(timer<=0)clearInterval(timerInt)},1000)
}
function stopTimer(){clearInterval(timerInt);$("timer").textContent="—"}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script>
</body>
</html>
