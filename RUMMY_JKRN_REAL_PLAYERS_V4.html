<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>RUMMY JKRN - 201 POOL RUMMY</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; text-align: center; }

.top-bar { display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: #000; border-bottom: 2px solid #333; }
h1 { margin: 0; color: #ffd700; font-size: 18px; }

.table { 
    position: relative; width: min(92vw, 1240px); height: 55vh; min-height: 400px;
    margin: 15px auto 160px; background: radial-gradient(ellipse at 50% 46%, #168a49 0%, #0b6a36 48%, #04361d 100%);
    border: 10px solid #3b2106; border-radius: 50% / 42%; box-shadow: 0 0 30px rgba(0,0,0,.8);
}

/* Center Piles Layout: Wild Joker (Left) | Closed Deck (Middle) | Open Deck (Right) */
.center-area {
    position: absolute; top: 38%; left: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 25px; align-items: center; justify-content: center;
}
.pile-container { text-align: center; }
.pile-label { font-size: 11px; color: #ffd700; margin-bottom: 4px; font-weight: bold; }
.pile { 
    width: 75px; height: 110px; border-radius: 6px; display: flex; flex-direction: column; 
    align-items: center; justify-content: center; font-size: 16px; font-weight: bold; 
    background: white; color: black; border: 2px solid #fff; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
.joker-pile { border-color: #ffd700 !important; background: #fff; }
.draw-pile { background: #174a9c; color: white; }
.draw-pile::after { content: '🂠'; font-size: 40px; }
.deck-count { font-size: 10px; color: #ffd700; margin-top: 3px; font-weight: bold; }

.player-area { position: absolute; left: 50%; transform: translateX(-50%); bottom: -150px; width: 96vw; display: flex; flex-direction: column; align-items: center; }
.groups-container { display: flex; justify-content: center; gap: 8px; min-height: 125px; }
.card-group { display: flex; flex-direction: column; background: rgba(0,0,0,0.4); padding: 4px; border-radius: 6px; align-items: center; }
.cards-in-group { display: flex; align-items: flex-end; }
.card { 
    width: 65px; height: 95px; background: white; color: black; border-radius: 5px; 
    display: flex; flex-direction: column; justify-content: space-between; font-size: 15px; 
    font-weight: bold; padding: 4px; border: 1px solid #bbb; cursor: pointer; position: relative;
}
.cards-in-group .card + .card { margin-left: -30px; }
.red { color: #d32f2f; }
.black { color: #111; }

.group-status-badge { margin-top: 3px; font-size: 9px; font-weight: bold; padding: 2px 4px; border-radius: 3px; background: #2e7d32; color: #fff; }

/* Bottom Score & Points Counter Bar */
.bottom-info-bar {
    position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(0,0,0,0.9);
    display: flex; justify-content: space-around; padding: 8px; border-top: 1px solid #444; font-size: 13px; z-index: 1000;
}
</style>
<script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="top-bar">
    <h1>🃏 POOL RUMMY (201 POOL)</h1>
    <div id="walletBox">🪙 50000</div>
</div>

<div class="table">
    <!-- Center Piles: Wild Joker Left, Closed Deck Center, Open Deck Right -->
    <div class="center-area">
        <div class="pile-container">
            <div class="pile-label">WILD JOKER</div>
            <div class="pile joker-pile" id="topJokerDisplay">9♠</div>
        </div>
        <div class="pile-container">
            <div class="pile-label">CLOSED DECK</div>
            <div class="pile draw-pile" onclick="drawCard()"></div>
            <div class="deck-count">52 Cards</div>
        </div>
        <div class="pile-container">
            <div class="pile-label">OPEN DECK</div>
            <div class="pile discard-pile" id="discardPile">4♣</div>
        </div>
    </div>

    <!-- Player Hand Cards -->
    <div class="player-area">
        <div class="groups-container" id="playerGroupsContainer"></div>
    </div>
</div>

<!-- Points Count Bar (Dynamic: Updates from 20 to 5 when grouped correctly) -->
<div class="bottom-info-bar">
    <div>Total Points in Hand: <strong id="totalPointsDisplay" style="color: #ffd700;">20</strong></div>
    <div>Points Count: <strong id="pointsCountDisplay" style="color: #00ff00;">5</strong></div>
    <div><button onclick="autoSortCards()" style="background:#2e7d32; color:#fff; border:none; padding:4px 10px; border-radius:4px; cursor:pointer;">Auto Sort</button></div>
</div>

<script>
let playerGroups = [
    [{rank:'3', suit:'♥', color:'red'}, {rank:'4', suit:'♥', color:'red'}, {rank:'5', suit:'♥', color:'red'}], // 1st Life
    [{rank:'2', suit:'♣', color:'black'}, {rank:'JOKER', suit:'🃏', color:'red'}], // 2nd Life with Joker
    [{rank:'K', suit:'♥', color:'red'}, {rank:'A', suit:'♥', color:'red'}] // Remaining / Invalid points
];

function updateUI() {
    const container = document.getElementById("playerGroupsContainer");
    container.innerHTML = "";
    
    let totalDeadwood = 0;

    playerGroups.forEach((group, gIdx) => {
        const gDiv = document.createElement("div");
        gDiv.className = "card-group";
        const cardsDiv = document.createElement("div");
        cardsDiv.className = "cards-in-group";

        let isGroupValid = group.length >= 3; // Simple validation for demo

        group.forEach(card => {
            const cDiv = document.createElement("div");
            cDiv.className = `card ${card.color}`;
            cDiv.innerHTML = `<div>${card.rank}</div><div style="font-size:22px; margin:auto;">${card.suit}</div>`;
            cardsDiv.appendChild(cDiv);
        });
        gDiv.appendChild(cardsDiv);

        const badge = document.createElement("div");
        badge.className = "group-status-badge";
        if(isGroupValid) {
            badge.innerText = "Valid Group";
            badge.style.background = "#2e7d32";
        } else {
            badge.innerText = "Remaining (5 pts)";
            badge.style.background = "#d32f2f";
            totalDeadwood += 5; // జోకర్ యాడ్ అయ్యాక పాయింట్లు 20 నుండి 5 కి తగ్గుతాయి
        }
        gDiv.appendChild(badge);
        container.appendChild(gDiv);
    });

    // పాయింట్లు అప్డేట్ చేయడం (ఉదాహరణకు జోకర్ సెట్ అయ్యాక 5 పాయింట్లు చూపించడం)
    document.getElementById("totalPointsDisplay").innerText = totalDeadwood > 0 ? totalDeadwood + 15 : 5;
    document.getElementById("pointsCountDisplay").innerText = totalDeadwood > 0 ? totalDeadwood : 5;
}

function autoSortCards() {
    updateUI();
}

window.onload = updateUI;
function drawCard() { alert("Card Drawn from Closed Deck!"); }
</script>
</body>
</html>
