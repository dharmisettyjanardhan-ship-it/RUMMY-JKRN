<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RUMMY JKRN V11 FINAL - POOL RUMMY - 201 POOL STRICT RULES</title>
<style>
* { box-sizing: border-box; }
body { 
    margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background: #111; color: white; text-align: center; overflow-x: hidden; 
}

.top-bar {
    display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; background: #000; border-bottom: 2px solid #333;
}
h1 { margin: 0; color: #ffd700; font-size: 18px; }
.top-right-box { display: flex; align-items: center; gap: 8px; }
#walletBox { font-size: 14px; font-weight: bold; color: #ffeb3b; background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 15px; border: 1px solid #b8860b; }

.scoreboard-icon-btn, .sound-toggle-btn {
    background: linear-gradient(to bottom, #ffd700, #ff8f00);
    color: #000; border: 2px solid #fff; padding: 6px 12px; border-radius: 20px;
    font-size: 13px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 5px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.5); transition: transform 0.2s;
}
.sound-toggle-btn { background: linear-gradient(to bottom, #4caf50, #2e7d32); color: #fff; }
.scoreboard-icon-btn:hover, .sound-toggle-btn:hover { transform: scale(1.05); }

.table { 
    position: relative;
    width: min(92vw, 1240px);
    max-width: 1240px;
    height: 58vh;
    min-height: 430px;
    margin: 18px auto 190px;
    background: radial-gradient(ellipse at 50% 46%, #168a49 0%, #0b6a36 48%, #04361d 100%);
    border: 10px solid #3b2106;
    border-radius: 50% / 42%;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.06), inset 0 0 60px rgba(0,0,0,.82), 0 0 28px rgba(0,0,0,.75);
    overflow: visible;
}

/* PLAYERS EDGES & PROFILE PICTURES */
.opp-box {
    position: absolute; display: flex; align-items: center;
    background: rgba(0,0,0,0.85); border-radius: 30px; padding: 4px 12px 4px 4px;
    border: 2px solid #555; width: 185px; box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    transition: border 0.3s ease, box-shadow 0.3s ease;
}
.opp-box.active-turn { border: 3px solid #00ff00 !important; box-shadow: 0 0 20px #00ff00; }
.opp-box.eliminated { 
    opacity: 0.35 !important; filter: grayscale(100%); border: 2px solid #d32f2f !important; pointer-events: none;
}
.opp-box.dropped .opp-avatar-container::after {
    content: "Drop";
    position: absolute; inset: 0; background: rgba(0, 0, 0, 0.75);
    color: #ff4d4d; font-size: 11px; font-weight: 900;
    display: flex; align-items: center; justify-content: center;
    border-radius: 50%; border: 1px solid #ff4d4d; z-index: 10;
}

.opp-avatar-container { position: relative; width: 38px; height: 38px; }
.opp-avatar {
    width: 38px; height: 38px; border-radius: 50%; background: #ccc; 
    display: flex; align-items: center; justify-content: center; font-size: 20px; color: #333; border: 2px solid white;
    background-size: cover; background-position: center;
}
#opp2 .opp-avatar { background-image: url('https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'); color: transparent; }
#opp3 .opp-avatar { background-image: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100'); color: transparent; }
#opp4 .opp-avatar { background-image: url('https://images.unsplash.com/photo-1517841905240-472988babdf9?w=100'); color: transparent; }
#opp5 .opp-avatar { background-image: url('https://images.unsplash.com/photo-1524504388940-b1c1722653e1?w=100'); color: transparent; }

.opp-timer {
    position: absolute; bottom: -4px; right: -4px; background: #000; color: #00ff00; 
    font-size: 9px; font-weight: bold; padding: 1px 4px; border-radius: 8px; border: 1px solid #00ff00;
    display: none;
}
.opp-box.active-turn .opp-timer { display: block; }

.opp-details { margin-left: 8px; text-align: left; }
.opp-name { font-size: 11px; color: #fff; margin: 0; white-space: nowrap; }
.opp-score { font-size: 11px; color: #ffd700; font-weight: bold; margin: 0; }
.opp-action { font-size: 9px; color: #00ff00; margin: 0; font-style: italic; }

#opp2 { top: 35% !important; left: 2% !important; }
#opp3 { top: 12% !important; left: 20% !important; }
#opp4 { top: 4% !important; left: 50% !important; transform: translateX(-50%); }
#opp5 { top: 12% !important; right: 20% !important; }
#opp6 { top: 35% !important; right: 2% !important; }

.center-area {
    position: absolute; top: 33%; left: 50%; transform: translate(-50%, -50%);
    display: flex; gap: 20px; align-items: center; justify-content: center;
}
.pile-container { text-align: center; }
.pile-label { font-size: 12px; color: rgba(255,255,255,0.9); margin-bottom: 6px; font-weight: bold; }

.pile { 
    width: 95px; height: 135px; border-radius: 8px; display: flex; align-items: flex-start; justify-content: flex-start; 
    font-size: 24px; font-weight: bold; box-shadow: 0 5px 15px rgba(0,0,0,0.6); border: 2px solid #fff; cursor: pointer;
    background: white; color: black; position: relative; padding: 6px; transition: transform 0.2s;
}
.draw-pile { background: #174a9c; color: white; border-color: #aaa; align-items: center; justify-content: center; }
.draw-pile::after { content: '🂠'; font-size: 54px; }
.deck-count { font-size: 12px; color: #ffd700; margin-top: 5px; font-weight: bold; }
.joker-pile { font-size: 18px; border: 2px solid #ffd700 !important; flex-direction: column; }

/* CARDS PLACEMENT - BOTTOM AREA */
.player-area {
    position: fixed !important; left: 50% !important; bottom: 2% !important;
    transform: translateX(-50%) !important; width: min(96vw, 1180px) !important;
    text-align: center; display: flex; flex-direction: column; align-items: center; z-index: 950 !important;
}
.player-info { 
    background: rgba(0,0,0,0.85); padding: 4px 14px; border-radius: 12px; margin-bottom: 4px; font-size: 12px; font-weight: bold; 
    border: 2px solid #555; display: flex; align-items: center; gap: 10px;
}
.player-info.active-turn { border: 3px solid #00ff00 !important; box-shadow: 0 0 15px #00ff00; }
.player-timer { color: #00ff00; font-size: 13px; background: rgba(0,0,0,0.9); padding: 1px 6px; border-radius: 8px; border: 1px solid #00ff00; display: none; }
.player-info.active-turn .player-timer { display: inline-block; }

.groups-container {
    display: flex; justify-content: center; align-items: flex-end; gap: 10px;
    height: 145px; overflow-x: auto; max-width: 96%; padding: 2px 6px 0; z-index: 951;
}
.card-group { 
    display: flex; flex-direction: column; background: rgba(0,0,0,0.5); padding: 4px; 
    border-radius: 6px; align-items: center; flex-shrink: 0; border: 2px dashed transparent;
}
.cards-in-group { display: flex; align-items: flex-end; min-height: 112px; }
.card { 
    width: 74px; height: 108px; background: white; color: black; border-radius: 5px; 
    display: flex; flex-direction: column; align-items: flex-start; padding: 5px 5px 18px 5px; 
    box-shadow: -2px 0 5px rgba(0,0,0,0.6); cursor: grab; border: 1px solid #bbb; position: relative; user-select: none;
}
.cards-in-group .card + .card { margin-left: -36px; }
.selected { transform: translateY(-16px) !important; border: 2px solid #ff5722 !important; box-shadow: 0 0 10px #ff5722; }

.red { color: #d32f2f; }
.black { color: #111; }
.left-controls { position: absolute; left: 25px; bottom: 25px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
.action-buttons { position: absolute; right: 25px; bottom: 25px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
.left-controls button, .action-buttons button { padding: 12px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; color: white; text-transform: uppercase; }
.btn-drop { background: linear-gradient(to bottom, #e53935, #b71c1c); }
.btn-auto-sort { background: linear-gradient(to bottom, #2e7d32, #1b5e20); }
.btn-group { background: linear-gradient(to bottom, #fdd835, #fbc02d); color: #000; display: none; }
.btn-discard { background: linear-gradient(to bottom, #2196f3, #0d47a1); display: none; }
.btn-declare { background: linear-gradient(to bottom, #ff9800, #e65100); }
</style>
</head>
<body>
<div class="top-bar">
    <h1>♛ RUMMY JKRN</h1>
    <div id="walletBox">🪙 <span id="walletBalance">50000</span></div>
</div>
<div class="table">
    <div class="opp-box" id="opp2"><div class="opp-avatar-container"><div class="opp-avatar"></div><div class="opp-timer" id="timer-p2">30s</div></div><div class="opp-details"><p class="opp-name">Player 2</p><p class="opp-score">Scores: <span id="score-p2">0</span></p></div></div>
    <div class="opp-box" id="opp3"><div class="opp-avatar-container"><div class="opp-avatar"></div><div class="opp-timer" id="timer-p3">30s</div></div><div class="opp-details"><p class="opp-name">Player 3</p><p class="opp-score">Scores: <span id="score-p3">0</span></p></div></div>
    <div class="opp-box" id="opp4"><div class="opp-avatar-container"><div class="opp-avatar"></div><div class="opp-timer" id="timer-p4">30s</div></div><div class="opp-details"><p class="opp-name">Player 4</p><p class="opp-score">Scores: <span id="score-p4">0</span></p></div></div>
    <div class="opp-box" id="opp5"><div class="opp-avatar-container"><div class="opp-avatar"></div><div class="opp-timer" id="timer-p5">30s</div></div><div class="opp-details"><p class="opp-name">Player 5</p><p class="opp-score">Scores: <span id="score-p5">0</span></p></div></div>
    
    <div class="center-area">
        <div class="pile-container"><div class="pile-label">WILD JOKER</div><div class="pile joker-pile" id="topJokerDisplay">-</div></div>
        <div class="pile-container"><div class="pile-label">CLOSED DECK</div><div class="pile draw-pile"></div></div>
        <div class="pile-container"><div class="pile-label">OPEN DECK</div><div class="pile discard-pile" id="discardPile"></div></div>
    </div>

    <div class="left-controls">
        <button class="btn-drop" onclick="dropGame()">Drop</button>
        <button class="btn-auto-sort" onclick="autoSortCards()">Auto Sort</button>
    </div>

    <div class="player-area" id="playerArea">
        <div class="player-info" id="playerInfoBox">
            <span>YOU | Total: <span id="score-p1" style="color:#00ff00;">0</span></span>
            <span class="player-timer" id="timer-p1">⏳ <span id="timeLeft">30</span>s</span>
        </div>
        <div class="groups-container" id="playerGroupsContainer"></div>
    </div>

    <div class="action-buttons">
        <button class="btn-group" id="groupButton" onclick="groupSelectedCards()">Group</button>
        <button class="btn-discard" id="discardButton" onclick="discardCard()">Discard</button>
        <button class="btn-declare" id="declareButton" onclick="declareGame()">Declare</button>
    </div>
</div>
<script>
let timeLeft = 30;
setInterval(() => {
    timeLeft = timeLeft > 0 ? timeLeft - 1 : 30;
    document.getElementById("timeLeft").innerText = timeLeft;
}, 1000);

function dropGame() {
    document.getElementById("opp2").classList.add("dropped");
    alert("You dropped! +25 points added.");
}
function autoSortCards() { alert("Auto-sorting cards..."); }
function groupSelectedCards() { alert("Grouping cards..."); }
function discardCard() { alert("Discarding card..."); }
function declareGame() { alert("Declaring game..."); }
</script>
</body>
</html>
